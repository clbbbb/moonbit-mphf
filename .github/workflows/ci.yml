name: CI

on:
  push:
  pull_request:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check
        run: moon check --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Check external package encapsulation
        run: python3 scripts/check_encapsulation.py
      - name: Build release
        run: moon build --release --deny-warn
      - name: Run example
        run: moon run cmd/main
